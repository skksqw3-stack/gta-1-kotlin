name: GTA 1 Android Build

on:
  push:
    paths:
      - '*.zip'
      - '*.z0*'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Manually
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-28" "build-tools;29.0.3"

      - name: Rename and Extract ZIP files
        run: |
          for i in 01 02 03 04 05; do
            if [ -f "GTA1_Kotlin_Android44 (1).z$i" ]; then
              mv "GTA1_Kotlin_Android44 (1).z$i" "project.z$i"
            fi
          done
          
          if [ ! -f "project.zip" ]; then
            echo "ERROR: project.zip not found!"
            exit 1
          fi
          
          mkdir -p extracted
          7z x project.zip -oextracted

      - name: Fix JCenter in build.gradle
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          
          echo "Fixing build.gradle in: $PROJECT_DIR"
          
          find "$PROJECT_DIR" -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          find "$PROJECT_DIR" -name "settings.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          
          echo "JCenter replaced with MavenCentral."

      - name: Setup Gradle Wrapper 7.5.1
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          
          cd "$PROJECT_DIR"
          
          # دانلود Gradle 7.5.1 و اکسترکت آن
          mkdir -p $HOME/gradle-7.5.1
          wget -q https://services.gradle.org/distributions/gradle-7.5.1-bin.zip
          unzip -q gradle-7.5.1-bin.zip -d $HOME/gradle-7.5.1
          
          # استفاده از مسیر کامل Gradle 7.5.1 برای ساخت wrapper
          $HOME/gradle-7.5.1/gradle-7.5.1/bin/gradle wrapper --gradle-version 7.5.1
          
          echo "Gradle wrapper 7.5.1 created successfully."

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          
          echo "Android project found at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          chmod +x ./gradlew
          
          # اجرای بیلد با wrapper محلی (که نسخه 7.5.1 را استفاده می‌کند)
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA1-Android-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
