name: GTA 1 Android Build

on:
  push:
    paths:
      - '*.zip'
      - '*.z0*'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Manually
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-28" "build-tools;29.0.3"

      - name: Rename and Extract ZIP files
        run: |
          for i in 01 02 03 04 05; do
            if [ -f "GTA1_Kotlin_Android44 (1).z$i" ]; then
              mv "GTA1_Kotlin_Android44 (1).z$i" "project.z$i"
            fi
          done
          
          if [ ! -f "project.zip" ]; then
            echo "ERROR: project.zip not found!"
            exit 1
          fi
          
          mkdir -p extracted
          7z x project.zip -oextracted

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find extracted -type f -path "*/app/build.gradle" -print -quit | sed 's|/app/build.gradle||')
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Android Gradle project not found."
              exit 1
            fi
            PROJECT_DIR="$SETTINGS_FILE"
          else
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          echo "Android project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA1-Android-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
